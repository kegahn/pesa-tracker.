name: Build APK

# Builds a debug APK and publishes it as a Release, so you get a direct
# tappable .apk download link on your phone instead of a zipped artifact.
on:
  push:
  workflow_dispatch:

# If you push twice quickly, cancel the older run instead of burning minutes on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed to publish the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run parser tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK with the build number
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/pesa-tracker-build${{ github.run_number }}.apk"

      # Path 1: plain artifact (zipped, needs login to download)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pesa-tracker-apk
          path: out/*.apk
          if-no-files-found: error

      # Path 2: Release — gives a direct .apk URL you can tap on the phone
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.sha }}`.
            Tap the .apk below on your phone to install.
          files: out/*.apk
